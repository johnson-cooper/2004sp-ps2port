project: client

targets:
  # Post-login companion-module experiment. This is intentionally separate
  # from the real-hardware-proven voice-only audsrv package.
  - name: rs2midi
    type: iop
    opt: -Os
    sources:
      - src/iop/rs2midi/rs2midi.c
    include_dirs:
      # PS2Build's generated imports C includes "irx_imports.h"; unlike the
      # old ps2sdk Makefiles it does not automatically add the imports.lst
      # source directory, so expose our module-local import header explicitly.
      - src/iop/rs2midi
    headers:
      # Header-only dependencies for the IOP RPC server/thread declarations
      # and direct SPU2 voice control. LIBSD itself is already loaded from ROM
      # by platform_init() before rs2midi is loaded after world entry.
      - loadcore
      - sifcmd
      - thbase
      - libsd
    imports_lst: src/iop/rs2midi/imports.lst

  # Local subset of fjtrujy/ps2_drivers. Built in-tree because the current
  # PS2Build SDK has no release artifact for the custom ps2_drivers package.
  - name: ps2_drivers_local
    type: ee_lib
    opt: -O1
    sources:
      - src/thirdparty/ps2_drivers/src/*.c
    include_dirs:
      - src/thirdparty/ps2_drivers/include
    headers:
      - kernel
      - mouse
      - kbd
    defines:
      - F_internals_ps2_sio2man_driver
      - F_init_ps2_sio2man_driver
      - F_deinit_ps2_sio2man_driver
      - F_internals_ps2_fileXio_driver
      - F_init_ps2_fileXio_driver
      - F_deinit_ps2_fileXio_driver
      - F_internals_ps2_memcard_driver
      - F_init_ps2_memcard_driver
      - F_deinit_ps2_memcard_driver
      - F_internals_ps2_bdm_driver
      - F_init_ps2_bdm_driver
      - F_deinit_ps2_bdm_driver
      - F_internals_ps2_usbd_driver
      - F_init_ps2_usbd_driver
      - F_deinit_ps2_usbd_driver
      - F_internals_ps2_usb_driver
      - F_init_ps2_usb_driver
      - F_deinit_ps2_usb_driver
      - F_internals_ps2_mx4sio_driver
      - F_init_ps2_mx4sio_driver
      - F_deinit_ps2_mx4sio_driver
      - F_internals_ps2_cdfs_driver
      - F_init_ps2_cdfs_driver
      - F_deinit_ps2_cdfs_driver
      - F___internal_deinit_only_boot_ps2_filesystem_driver
      - F_deinit_only_boot_ps2_filesystem_driver
      - F_init_only_boot_ps2_filesystem_driver
      - F_waitUntilDeviceIsReady_ps2_filesystem_driver
      - F_getBootDeviceID_ps2_filesystem_driver
      - F_internals_ps2_mouse_driver
      - F_init_ps2_mouse_driver
      - F_deinit_ps2_mouse_driver
      - F_internals_ps2_keyboard_driver
      - F_init_ps2_keyboard_driver
      - F_deinit_ps2_keyboard_driver

  - name: client
    type: ee
    opt: -O1
    # Milestone 3J: keep the normal client/BSS layout hardware-good and place
    # new rs2midi EE loader code/data in an isolated high-memory PT_LOAD.
    linkfile: ps2_audio_linkfile.ld
    sources:
      - src/*.c
      - src/entry/*.c
      - src/platform/*.c
      - src/thirdparty/*.c
      - src/datastruct/*.c
      - src/sound/*.c
      - src/wordenc/*.c
    include_dirs:
      - src/thirdparty/ps2_drivers/include
    defines:
      - client
      - __PS2__
      - WITH_RSA_LIBTOM
      - PS2IP_DNS
      # Modern PS2 UI milestone 1 stays outside the legacy Client renderer. Intercept only
      # prebuilt PS2SDK calls: the gsKit sprite wrapper reorganizes the final uploaded canvas,
      # while the padRead wrapper remaps the physical cursor back to the old viewport/sidebar
      # coordinate system. src/ps2_modern_ui.c undefines these before calling the real SDK APIs.
      - gsKit_prim_sprite_texture_3d=ps2_modern_gsKit_prim_sprite_texture_3d
      - padRead=ps2_modern_padRead
      # 2026-09-14: PS2_LOC_DECODE_ONLY (was here temporarily) answered its question - decode-only
      # mode (world_add_loc2() skipped) completed ALL 6 mapsquares' loc decode + world_build() +
      # reached "scene: build_scene complete" cleanly on real hardware. Bug confirmed to live inside
      # world_add_loc2()'s subtree, not decoding/Packet/world_build(). Removed so this build now
      # exercises the real, full path again, with new one-shot entry checkpoints in world_add_loc2()
      # and loctype_get_model() (world.c/loctype.c) to find exactly where in that subtree it dies.
    headers:
      - mouse
      - kbd
    libs:
      - gskit
      - dmakit
      - ps2ip
      - netman
      - patches
      # Vendored ps2_drivers subset, followed by the SDK EE client libraries it calls.
      - ps2_drivers_local
      - filexio
      - mouse
      - kbd
      - pad
      # Standalone PS2Build world package installed by install-audsrv-package.bat.
      # Keep audio off the EE software-mixing path: the first hardware milestone uses
      # audsrv only for preconverted SPU2 ADPCM playback.
      - audsrv
      - m
    embed_irx:
      # DEV9/NETMAN/SMAP remain embedded. dev9 WAS briefly removed from this list on the
      # (real, well-reasoned) theory that it's ROM-resident on real hardware and only ever needed
      # embedding to work around a PCSX2-specific HLE quirk - but the actual real-hardware test
      # regressed badly (the game hung/stalled much earlier, during boot, before even reaching
      # login) rather than improving anything. Reverted - see ps2.c's platform_init() for the fuller
      # note. Don't re-attempt un-embedding dev9 without new evidence; this was tried and it made
      # things worse, not better. netman/smap remain embedded - a real, deliberate step back from an
      # EE-memory-reclaim attempt (making
      # netman/smap file-loaded and freed after use) that had to be abandoned: it required loading
      # USB before networking so those two could be read from a working device, and doing that - on
      # TWO separate USB driver stacks (first usbhdfsd, then this same BDM stack) - caused a new
      # real-hardware-only stall mid-network-bring-up that never happened with everything embedded
      # and USB deferred until after DHCP. That the stall reproduced on both driver stacks is itself
      # evidence it's not about which driver, but about USB activity anywhere near network bring-up
      # at all - the same class of problem this project's own precedent already found once before
      # (SIO2MAN/PADMAN moved to AFTER network bring-up due to IOP resource/thread contention with
      # SMAP's own worker threads). A boot-time stall is a worse failure than the memory cost, so
      # this stays at the original, proven-stable sequence (see ps2.c's platform_init()): netman/smap
      # load and bring up networking completely first, USB loads only once that's done.
      #
      - dev9:dev9_embed
      - netman:netman_embed
      - smap:smap_embed
      # IRXs expected by the vendored ps2_drivers sources. Aliases deliberately
      # match their EXTERN_IRX(...) symbol names.
      - sio2man:sio2man
      - iomanx:iomanX
      - filexio:fileXio
      - mcman:mcman
      - mcserv:mcserv
      - bdm:bdm
      - bdmfs_fatfs:bdmfs_fatfs
      - usbd:usbd
      - usbmass_bd:usbmass_bd
      - mx4sio_bd:mx4sio_bd
      - cdfs:cdfs
      - mouse:ps2mouse
      - kbd:ps2kbd
      # MMCE is the one boot filesystem not recognized by ps2_drivers' boot-only helper.
      # Embed the full filesystem-capable world driver so an mmce0:/ or mmce1:/ launch can
      # restore its own boot filesystem after the mandatory clean IOP reset.
      - mmceman:mmceman_embed
      #
      # Storage IRXs are no longer hard-coded here. ps2_drivers restores only the filesystem the
      # ELF was launched from, at the same post-DHCP point where the hardware-proven BDM stack used
      # to load. Keep DEV9/NETMAN/SMAP embedded above; their ordering remains unchanged.
      # Audio is deliberately loaded only after network + filesystem + PAD bring-up in
      # platform_init(); embedding avoids adding runtime filesystem dependency.
      - audsrv:audsrv_embed
